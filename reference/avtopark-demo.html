<title>Avtopark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar with company views (Today / Fleet / Calendar / Customers / Fines) plus a public-site preview. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#131925; --muted:#5A6476; --line:#DCE1E9;
  --accent:#2347C8; --accent-soft:#E3E9FB; --accent-ink:#FFFFFF;
  --ok:#17834A; --ok-soft:#E1F3E8; --warn:#A8670E; --warn-soft:#FBEED9; --info:#6B3FC4; --info-soft:#EEE7FB;
  --bad:#C2362B; --bad-soft:#FBE4E1;
  --past:#C9CFD9; --past-ink:#3D4656;
  --hero:#102A6B; --hero-ink:#FFFFFF; --road:#F2C14E;
  --font-body:"Manrope","Noto Sans Georgian",system-ui,sans-serif;
  --font-plate:"Barlow Semi Condensed","Arial Narrow",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1118; --surface:#151B25; --sunk:#1B2330; --ink:#E5E9F0; --muted:#94A0B3; --line:#263041;
  --accent:#7590FF; --accent-soft:#1F2A4D; --accent-ink:#0D1118;
  --ok:#4CC27F; --ok-soft:#14301F; --warn:#E3A54A; --warn-soft:#352612; --info:#B497F5; --info-soft:#2A2042;
  --bad:#F07167; --bad-soft:#3A1B1A;
  --past:#323C4D; --past-ink:#C3CBD8; --hero:#0F1C3D; --hero-ink:#E8EDFF; --road:#E3B341; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1118; --surface:#151B25; --sunk:#1B2330; --ink:#E5E9F0; --muted:#94A0B3; --line:#263041;
  --accent:#7590FF; --accent-soft:#1F2A4D; --accent-ink:#0D1118;
  --ok:#4CC27F; --ok-soft:#14301F; --warn:#E3A54A; --warn-soft:#352612; --info:#B497F5; --info-soft:#2A2042;
  --bad:#F07167; --bad-soft:#3A1B1A;
  --past:#323C4D; --past-ink:#C3CBD8; --hero:#0F1C3D; --hero-ink:#E8EDFF; --road:#E3B341; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-plate);font-weight:700;font-size:15px}
.brand b{font-weight:800;font-size:16px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.demo-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:4px;margin-left:4px;vertical-align:2px}
.controls{display:flex;gap:8px;align-items:center}
.role{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:12.5px;font-weight:600;background:var(--surface)}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.navbar{border-top:1px solid var(--line)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
nav.tabs a{padding:6px 12px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
nav.tabs a:hover{background:var(--sunk)}
nav.tabs a[aria-current="page"]{background:var(--sunk);color:var(--ink)}
nav.tabs a.site-link{margin-left:auto;border:1px solid var(--line)}
nav.tabs .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;font-weight:700}

main{padding-block:22px 56px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;max-width:65ch}
h2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn svg{width:15px;height:15px}

.plate{display:inline-flex;align-items:stretch;border:1.5px solid #131925;border-radius:4px;background:#fff;color:#111;font-family:var(--font-plate);font-weight:700;font-size:14px;line-height:1;overflow:hidden;white-space:nowrap;letter-spacing:.03em}
.plate .strip{background:#1E40AF;color:#fff;font-size:8px;padding:3px 3px 0;display:flex;align-items:flex-end}
.plate .num{padding:4px 6px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-available,.s-paid,.s-returned,.s-done{color:var(--ok);background:var(--ok-soft)}
.s-out,.s-active,.s-held,.s-charged{color:var(--accent);background:var(--accent-soft)}
.s-service,.s-new,.s-upcoming{color:var(--warn);background:var(--warn-soft)}
.s-returning,.s-leaving,.s-request{color:var(--info);background:var(--info-soft)}
.s-black,.s-withheld,.s-unmatched{color:var(--bad);background:var(--bad-soft)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{color:var(--muted);font-size:12px;font-weight:600}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:13px;color:var(--muted);font-weight:600}
.meter{height:4px;background:var(--sunk);border-radius:2px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel.req{border-color:var(--info);margin-bottom:18px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--sunk)}
.item .who{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .right{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.item .right b{display:block;color:var(--ink);font-size:13.5px}
.req-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.req-item:first-child{border-top:0}
.req-item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--muted);padding:18px 4px;font-size:13.5px}
.date-chip{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;background:var(--sunk);padding:4px 8px;border-radius:6px;text-align:center;min-width:54px}
.rem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.rem:first-child{border-top:0}
.rem:hover{background:var(--sunk)}
.rem .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800}
.rem .ic.bad{background:var(--bad-soft);color:var(--bad)}
.rem .ic.warn{background:var(--warn-soft);color:var(--warn)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip span{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.table{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:14px}
.trow{display:grid;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.trow:hover{background:var(--sunk)}
.trow.head{cursor:default;border-top:0;background:var(--sunk);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:8px}
.trow>*{min-width:0}
.fleet .trow{grid-template-columns:110px minmax(0,1.6fr) minmax(0,.8fr) 100px 150px minmax(0,1.3fr)}
.cust .trow{grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) 70px 100px minmax(0,1fr) 130px}
.fines .trow{grid-template-columns:96px 110px minmax(0,1.4fr) 80px minmax(0,1.3fr) 120px minmax(0,1fr);cursor:default}
.fines .trow:hover{background:none}
.car-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.car-spec{color:var(--muted);font-size:12.5px}
.rate{font-variant-numeric:tabular-nums;font-weight:700}
.rate small{color:var(--muted);font-weight:500}
.next{color:var(--muted);font-size:12.5px}
.warn-dot{color:var(--warn);font-weight:800;margin-left:4px}
.num{font-variant-numeric:tabular-nums}
.search-in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;min-width:220px}
@media (max-width:860px){
  .trow.head{display:none}
  .fleet .trow{grid-template-columns:auto 1fr auto;grid-template-areas:"a b d" "e f f";row-gap:8px}
  .fleet .c-plate{grid-area:a}.fleet .c-name{grid-area:b}.fleet .c-class{display:none}.fleet .c-rate{grid-area:d;text-align:right}.fleet .c-status{grid-area:e}.fleet .c-next{grid-area:f;text-align:right}
  .cust .trow{grid-template-columns:1fr auto;row-gap:6px}
  .cust .c-phone,.cust .c-n{display:none}
  .fines .trow{grid-template-columns:1fr auto;row-gap:6px}
}

/* calendar */
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range{font-weight:700;font-variant-numeric:tabular-nums;min-width:150px;text-align:center}
.hint{color:var(--muted);font-size:12.5px;margin:10px 0 0}
.gantt{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
.g-grid{display:grid;grid-template-columns:var(--label) calc(var(--cell) * var(--n));width:max-content;min-width:100%}
.g-label{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);border-top:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.g-label .car-name{font-size:12.5px}
.g-head{display:grid;grid-template-columns:repeat(var(--n),var(--cell))}
.g-head div{text-align:center;padding:6px 0;font-size:11px;color:var(--muted);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.g-head div b{display:block;font-size:14px;color:var(--ink)}
.g-head div.we{background:var(--sunk)}
.g-head div.td b{color:var(--accent-ink);background:var(--accent);border-radius:6px;display:inline-block;padding:1px 6px}
.g-label.corner{border-top:0;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.g-track{position:relative;height:50px;border-top:1px solid var(--line);cursor:copy}
.g-cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),var(--cell));pointer-events:none}
.g-cells div{border-right:1px solid var(--line)}
.g-cells div.we{background:color-mix(in srgb,var(--sunk) 70%,transparent)}
.g-cells div.td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.g-track.service{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--warn) 12%,transparent) 8px 16px);cursor:not-allowed}
.bar{position:absolute;top:8px;bottom:8px;border-radius:6px;border:0;padding:0 8px;font-size:12px;font-weight:700;text-align:left;overflow:hidden;white-space:nowrap;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center}
.bar.future{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.bar.past{background:var(--past);color:var(--past-ink)}
.bar.request{background:repeating-linear-gradient(135deg,var(--info-soft) 0 6px,color-mix(in srgb,var(--info) 22%,var(--info-soft)) 6px 12px);color:var(--info);box-shadow:inset 0 0 0 1.5px var(--info)}
.bar.cut-l{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cut-r{border-top-right-radius:0;border-bottom-right-radius:0}
.bar span{overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog.wide{width:min(860px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,14,22,.5)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 8px}
.dlg-head h3{margin:0;font-size:17px;font-weight:800}
.dlg-head .badges{display:flex;gap:6px;margin-right:auto;flex-wrap:wrap}
.dtabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.dtabs button{border:0;background:none;padding:10px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.dtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dtabs button:disabled{opacity:.4;cursor:not-allowed}
.dtabs .tick{color:var(--ok)}
.pane{padding:16px 18px 18px}
form.fm,.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.fm.padded{padding:8px 18px 18px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.fld input:disabled{opacity:.6}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check.full{grid-column:1/-1}
.extras{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.extra{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.extra:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.extra .p{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.extra select{border:1px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--surface)}
@media (max-width:520px){.extras{grid-template-columns:1fr}}
.summary{grid-column:1/-1;background:var(--sunk);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:3px}
.summary .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.summary .ln span:first-child{color:var(--muted)}
.summary .tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px;margin-top:3px;font-weight:800;font-size:16px}
.summary .dep{font-size:12.5px;color:var(--muted)}
.err{grid-column:1/-1;color:var(--bad);font-weight:600;font-size:13px;background:var(--bad-soft);padding:8px 10px;border-radius:8px}
.info-box{grid-column:1/-1;color:var(--muted);font-size:12.5px;background:var(--sunk);padding:8px 10px;border-radius:8px}
.actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:4px;flex-wrap:wrap}
.actions .spacer{margin-right:auto}
@media (max-width:480px){form.fm,.fm{grid-template-columns:1fr}}

/* inspection */
.insp{display:grid;grid-template-columns:230px 1fr;gap:20px}
@media (max-width:640px){.insp{grid-template-columns:1fr}}
.diagram{width:100%;max-width:230px;display:block;background:var(--sunk);border-radius:10px;cursor:crosshair;margin:0 auto}
.dmg-types{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.dmg-types button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer}
.dmg-types button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.fuel{display:flex;gap:3px}
.fuel button{flex:1;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;padding:0}
.fuel button.on{background:var(--ok);border-color:var(--ok)}
.fuel-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
.dmg-list{display:flex;flex-direction:column;gap:4px;font-size:13px}
.dmg-list div{display:flex;align-items:center;gap:8px}
.dmg-list .mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;background:var(--bad);flex:none}
.dmg-list .mk.old{background:var(--past);color:var(--past-ink)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.photos button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:20px;height:20px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer;padding:0}
.file-btn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--muted);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.file-btn input{position:absolute;width:1px;height:1px;opacity:0}
.file-btn:focus-within{outline:2px solid var(--accent)}
.cmp{background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:13px}
.cmp .ln{display:flex;justify-content:space-between;gap:10px}
.t-warn{color:var(--warn);font-weight:700}
.t-bad{color:var(--bad);font-weight:700}
.t-ok{color:var(--ok);font-weight:700}
.stamp{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.insp .wide{grid-column:1/-1;min-width:0}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.shot{border:1px solid var(--line);border-radius:8px;padding:7px;display:flex;flex-direction:column;gap:5px;min-width:0}
.shot .nm{font-size:12px;font-weight:700}
.shot .pair{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.shot .pair.one{grid-template-columns:1fr}
.shot .box{aspect-ratio:4/3;border-radius:5px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;position:relative;font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.shot .box img{width:100%;height:100%;object-fit:cover;display:block}
.shot label.box{cursor:pointer;border:1px dashed var(--muted)}
.shot label.box:focus-within{outline:2px solid var(--accent)}
.shot .box input{position:absolute;opacity:0;width:1px;height:1px}
.shot .rm{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:20px;height:20px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer;padding:0}
.shot .cap{font-size:10.5px;color:var(--muted)}
.cmp input{width:100px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;text-align:right}
.cmp .ln{align-items:center}

/* contract (paper stays white in both themes, like a printed sheet) */
.paper{background:#FFFFFF;color:#1A1A1A;border:1px solid var(--line);border-radius:8px;padding:24px 26px;font-size:13px;line-height:1.65;max-height:50vh;overflow:auto}
.paper h4{margin:0 0 2px;font-size:16px;text-align:center}
.paper .no{text-align:center;color:#555;font-size:12px;margin-bottom:14px}
.paper table{width:100%;border-collapse:collapse;margin:8px 0;font-variant-numeric:tabular-nums}
.paper td{border-bottom:1px solid #E2E2E2;padding:4px 0}
.paper td:last-child{text-align:right}
.paper ol{padding-left:18px;margin:6px 0}
.paper .sigs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.paper .sigs div{border-top:1px solid #999;padding-top:4px;font-size:12px;color:#555;min-height:70px;position:relative}
.paper .sigs img{position:absolute;bottom:22px;left:0;height:56px}
.sigpad{margin-top:14px}
.sigpad canvas{width:100%;height:140px;background:#FFFFFF;border:1.5px dashed var(--muted);border-radius:8px;touch-action:none;display:block;cursor:crosshair}
.sigpad .row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap}

.doc-up{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc-card{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.doc-card img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px}
.doc-card .ph{aspect-ratio:3/2;border-radius:6px;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:12px}
.hist{grid-column:1/-1}
@media (max-width:480px){.doc-up{grid-template-columns:1fr}}

/* public site preview */
.site-frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.site-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--sunk);font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.site-bar .dots{display:flex;gap:5px}
.site-bar .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.site-bar .url{background:var(--surface);border-radius:6px;padding:3px 10px;flex:1;max-width:340px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.site-top{display:flex;align-items:center;gap:12px;padding:14px 22px;flex-wrap:wrap}
.site-top b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.site-top .cities{color:var(--muted);font-size:12.5px;margin-right:auto}
.site-top select{border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--surface);font-weight:600}
.hero{background:var(--hero);color:var(--hero-ink);padding:34px 22px 30px;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,var(--road) 0 30px,transparent 30px 56px)}
.hero h2{font-size:clamp(24px,4vw,34px);color:var(--hero-ink);text-transform:none;letter-spacing:-.02em;font-weight:800;margin:0 0 6px;text-wrap:balance;max-width:22ch}
.hero p{margin:0;opacity:.85;max-width:60ch}
.search{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;background:var(--surface);color:var(--ink);padding:12px;border-radius:12px;margin-top:20px;align-items:end}
.search .btn{height:38px}
@media (max-width:720px){.search{grid-template-columns:1fr 1fr}.search .loc,.search .btn{grid-column:1/-1;justify-content:center}}
.site-sec{padding:24px 22px;border-top:1px solid var(--line)}
.site-sec h3{margin:0 0 12px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.cars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.car-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.car-card .art{background:var(--sunk);border-radius:8px;aspect-ratio:240/110;overflow:hidden;display:grid;place-items:center}
.car-card .art img{width:100%;height:100%;object-fit:cover}
.car-card .art svg{width:100%;height:100%}
.car-card .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.car-card h4{margin:0;font-size:16px;font-weight:800}
.car-card .specs{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.car-card .pr{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.car-card .pr b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.car-card .pr small{color:var(--muted);font-size:12px;display:block}
.car-card.na{opacity:.55}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.step{background:var(--sunk);border-radius:10px;padding:14px}
.step .n{font-family:var(--font-plate);font-weight:700;font-size:22px;color:var(--accent)}
.step b{display:block;margin:2px 0 4px}
.step p{margin:0;color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.two ul,.rules ul{margin:0;padding-left:18px;display:grid;gap:6px;max-width:65ch}
@media (max-width:720px){.steps,.two{grid-template-columns:1fr}}
.rules-note{font-size:12px;color:var(--warn);margin-top:12px}
.ok-screen{text-align:center;padding:30px 20px}
.ok-screen .big{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 10px;font-size:26px;font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13.5px;z-index:20;max-width:calc(100vw - 32px)}
.note{color:var(--muted);font-size:12px;margin-top:28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
[data-role="operator"] .mgr-only{display:none!important}
@media (prefers-reduced-motion:no-preference){.bar,.item,.trow{transition:background-color .12s}}

  return n?t("next_bk",{d:fmt(n.start)}):t("next_none");
}
function monthStats(){
  const d=parse(TODAY),ms=iso(new Date(d.getFullYear(),d.getMonth(),1)),me=iso(new Date(d.getFullYear(),d.getMonth()+1,1)),dim=diff(ms,me);
  let carDays=0,rev=0;
  for(const b of confirmed()){const a=b.start>ms?b.start:ms,z=b.end<me?b.end:me,n=diff(a,z);if(n>0){carDays+=n;rev+=n*priceOf(b).total/bDays(b)}}
  const held=DB.bookings.filter(b=>b.deposit&&b.deposit.status==="held").reduce((s,b)=>s+b.deposit.amount,0);
  return {util:DB.cars.length?carDays/(DB.cars.length*dim):0,rev,held};
}
function remindersFor(car){
  const r=[],left=car.oilKm+car.oilEvery-car.km;
  if(left<0)r.push({lvl:"bad",ic:"OIL",txt:t("r_oil_over",{n:(-left).toLocaleString("en-US")})});
  else if(left<1000)r.push({lvl:"warn",ic:"OIL",txt:t("r_oil_soon",{n:left.toLocaleString("en-US")})});
  const dIns=diff(TODAY,car.insUntil),dInsp=diff(TODAY,car.inspUntil);
  if(dIns<0)r.push({lvl:"bad",ic:"INS",txt:t("r_ins_over",{d:fmt(car.insUntil)})});else if(dIns<=30)r.push({lvl:"warn",ic:"INS",txt:t("r_ins_soon",{d:fmt(car.insUntil)})});
  if(dInsp<0)r.push({lvl:"bad",ic:"TI",txt:t("r_insp_over",{d:fmt(car.inspUntil)})});else if(dInsp<=30)r.push({lvl:"warn",ic:"TI",txt:t("r_insp_soon",{d:fmt(car.inspUntil)})});
  return r;
}
function fineMatch(f){
  const d=f.at.slice(0,10),x=segsFor(f.carId).filter(x=>x.start<=d&&x.end>=d).sort((a,b)=>b.start.localeCompare(a.start))[0];
  return x?x.b:null;
}
function readImage(file,max=900){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

const CELL=()=>window.innerWidth<640?44:56;
function renderCalendar(){
  const cell=CELL(),label=window.innerWidth<640?132:210,days=[...Array(N)].map((_,i)=>addDays(winStart,i)),last=days[N-1];
  const cls=s=>{const d=parse(s).getDay();return(d===0||d===6?"we ":"")+(s===TODAY?"td":"")};
  const head=days.map(s=>{const d=parse(s);return `<div class="${cls(s)}">${L().wd[d.getDay()]}<b>${d.getDate()}</b></div>`}).join("");
  const cells=days.map(s=>`<div class="${cls(s)}"></div>`).join("");
  const rows=DB.cars.map(c=>{
    const bars=occAll(c.id).map(sg=>{
      const b=sg.b,si=diff(winStart,sg.start)+.5,ei=diff(winStart,sg.end)+.5,l=Math.max(si,0),r=Math.min(ei,N);
      if(r<=0||l>=N)return"";
      const k=b.status==="request"?"request":sg.end<=TODAY?"past":sg.start>TODAY?"future":"";
      const u=custById(b.customerId),sw=b.swaps&&b.swaps.length?"⇄ ":"";
      return `<button class="bar ${k} ${si<0?"cut-l":""} ${ei>N?"cut-r":""}" type="button" data-booking="${b.id}" style="left:${l*cell}px;width:${(r-l)*cell-2}px" title="${esc(u?.name)} · ${fmt(sg.start)} – ${fmt(sg.end)}"><span>${sw}${esc(u?.name)}</span></button>`;
    }).join("");
    return `<div class="g-label"><div class="car-name">${esc(carLabel(c))}</div><div>${plate(c.plate)}</div></div><div class="g-track ${c.service?"service":""}" data-track="${c.id}"><div class="g-cells">${cells}</div>${bars}</div>`;
  }).join("");
  const a=parse(winStart),z=parse(last);
  $("v-calendar").innerHTML=`
    <div class="view-head"><div><h1>${t("cal_title")}</h1></div>
      <div class="cal-bar">
        <button class="btn" type="button" data-shift="-7" aria-label="${t("prev")}">←</button>

        <button class="btn" type="button" data-shift="7" aria-label="${t("next")}">→</button>
        <button class="btn" type="button" data-shift="0">${t("today_btn")}</button>

      </div></div>
    <div class="gantt"><div class="g-grid" style="--cell:${cell}px;--label:${label}px;--n:${N}"><div class="g-label corner">${t("h_fleet")}</div><div class="g-head">${head}</div>${rows}</div></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>${t("lg_active")}</span><span><i style="background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)"></i>${t("lg_future")}</span><span><i style="background:var(--past)"></i>${t("lg_past")}</span><span><i style="background:repeating-linear-gradient(135deg,var(--info-soft) 0 3px,color-mix(in srgb,var(--info) 35%,var(--info-soft)) 3px 6px);box-shadow:inset 0 0 0 1px var(--info)"></i>${t("lg_request")}</span><span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,color-mix(in srgb,var(--warn) 45%,transparent) 3px 6px)"></i>${t("lg_service")}</span></div>

function saveDetails(approve){
  const d=draftFromForm(),name=$("bk-customer").value.trim(),err=m=>{$("bk-err").textContent=m;$("bk-err").hidden=false};
  if(!name)return err(t("e_name"));
  if(!d.start||!d.end||d.end<=d.start)return err(t("e_dates"));
  if((!BK.id||BK.carId!==d.carId)&&carById(d.carId).service)return err(t("e_service"));
  const swapped=BK.swaps&&BK.swaps.length;
  const dSegs=swapped?occ(BK).map((x,i,a)=>i===a.length-1?{...x,end:d.end}:{...x}):[{carId:d.carId,start:d.start,end:d.end}];
  if(swapped&&dSegs[dSegs.length-1].end<=dSegs[dSegs.length-1].start)return err(t("e_dates"));
  let clash=null;for(const sg of dSegs){const hit=occAll(sg.carId).find(x=>x.b!==BK&&sg.start<x.end&&sg.end>x.start);if(hit){clash=hit;break}}
  if(clash)return err(t("e_overlap",{who:custById(clash.b.customerId)?.name,a:fmt(clash.start),b:fmt(clash.end)}));
  if(swapped)d.segs=dSegs;
  let u=DB.customers.find(c=>c.name.toLowerCase()===name.toLowerCase());
  if(u&&u.blacklist&&!ackBlack){ackBlack=true;return err(t("e_black",{r:bil(u.reason)}))}
  if(!u){u={id:"u"+(++DB.seq),name,phone:$("bk-phone").value.trim(),email:"",country:"",docs:{license:false,passport:false},docImg:{},blacklist:false,reason:""};DB.customers.push(u)}
  else if($("bk-phone").value.trim())u.phone=$("bk-phone").value.trim();
  d.customerId=u.id;
  if(approve)d.status="confirmed";
  if(BK.id)Object.assign(BK,d);else{d.id="B-"+(++DB.seq);DB.bookings.push(d);BK=d}
  if(!save())return;
  toast(approve?t("t_approved"):t("t_saved"));render();renderBk();
}

  if(mode==="out")return{km:car.km,fuel:8,clean:1,damages:clone(car.damages||[]),photos:[],shots:{},at:null};
  const base=outBase(b);

}
function chargesFor(base,d){

  if(nf>0)items.push({l:t("fee_fuel",{n:nf,f:money(FEE.fuel8)}),v:nf*FEE.fuel8});

  const dmg=Math.max(0,+d.dmgFee||0);

}

    <div class="fld full"><span class="lbl">${t("swap_new")}</span></div>

    $("sw-go").disabled=!list.length;$("sw-err").hidden=!!list.length;if(!list.length)$("sw-err").textContent=t("swap_none");

      <canvas id="sig-c" width="900" height="210"></canvas>

function bindSig(){
  const cv=$("sig-c"),ctx=cv.getContext("2d");let drawing=false;sigDirty=false;
  ctx.lineWidth=3.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#14204A";
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener("pointerdown",e=>{drawing=true;sigDirty=true;cv.setPointerCapture(e.pointerId);const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});
  cv.addEventListener("pointermove",e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()});
  cv.addEventListener("pointerup",()=>drawing=false);cv.addEventListener("pointercancel",()=>drawing=false);
  $("sig-clear").onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);sigDirty=false};
  $("sig-save").onclick=()=>{if(!sigDirty)return;
    const out=document.createElement("canvas");out.width=450;out.height=105;out.getContext("2d").drawImage(cv,0,0,450,105);
    BK.signature=out.toDataURL("image/png");if(save()){toast(t("t_signed"));renderBk()}};
}

    <div class="site-sec" style="border-top:0">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b>${t("site_avail",{n:availN})}</b>
        <div class="chips">${classes.map(k=>`<button class="chip" type="button" data-scls="${k}" aria-pressed="${SITE.cls===k}">${k==="all"?t("all"):t("cls")[k]}</button>`).join("")}</div></div>
      <div class="cars-grid">${cars.map(({c,ok})=>`<div class="car-card ${ok?"":"na"}">
        <div class="art">${carArt(c)}</div>
        <span class="tag">${t("cls")[c.cls]}</span><h4>${esc(carLabel(c))}</h4>
        <div class="specs"><span>${esc(c.year)}</span><span>${t("trans")[c.trans]}</span><span>${t("fuel")[c.fuel]}</span></div>
        <div class="pr"><div><b>${cur(c.rate)}</b><small>${t("per_day")}</small><small>${t("site_total",{n})}: ${cur(c.rate*n)} · ${t("site_dep",{a:cur(c.deposit)})}</small></div>
          ${ok?`<button class="btn primary" type="button" data-sbook="${c.id}">${t("site_book")}</button>`:`<span class="car-spec" style="text-align:right;max-width:110px">${t("site_na")}</span>`}</div></div>`).join("")}</div>
      ${SITE.cur!=="GEL"?`<p class="hint">${t("cur_note")}</p>`:""}
    </div>
    <div class="site-sec"><h3>${t("how")}</h3><div class="steps">${[1,2,3].map(i=>`<div class="step"><div class="n">${i}</div><b>${t("how"+i)}</b><p>${t("how"+i+"d")}</p></div>`).join("")}</div></div>
    <div class="site-sec two"><div><h3>${t("req_t")}</h3><ul>${[1,2,3,4,5].map(i=>`<li>${t("req"+i)}</li>`).join("")}</ul></div><div><h3>${t("incl_t")}</h3><ul>${[1,2,3,4].map(i=>`<li>${t("incl"+i)}</li>`).join("")}</ul></div></div>
    <div class="site-sec rules"><h3>${t("rules_t")}</h3><ul>${L().rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul><p class="rules-note">${t("rules_note")}</p></div>
  </div>`;
  $("site-search").addEventListener("submit",e=>{e.preventDefault();const s=$("ss-start").value,en=$("ss-end").value;SITE.loc=$("ss-loc").value;if(s)SITE.start=s;SITE.end=en&&en>SITE.start?en:addDays(SITE.start,1);renderSite()});
  $("site-cur").addEventListener("change",e=>{SITE.cur=e.target.value;renderSite()});
}
function openSiteBooking(carId){
  const c=carById(carId),docs={};
  const tmp=()=>({rate:c.rate,start:SITE.start,end:SITE.end,extras:readExtras("sb"),deposit:{amount:c.deposit}});
  $("site-title").textContent=`${t("sb_title")} · ${carLabel(c)}`;
  $("site-body").innerHTML=`<form class="fm padded" id="sb-form" novalidate style="padding-top:12px">
    <div class="info-box" style="display:flex;gap:12px;align-items:center;color:var(--ink)"><div style="width:110px;flex:none" class="car-card"><div class="art" style="border-radius:6px">${carArt(c)}</div></div>
      <div><b>${esc(carLabel(c))}</b><br><span style="color:var(--muted)">${fmtFull(SITE.start)} – ${fmtFull(SITE.end)} · ${esc(t("loc")[SITE.loc])}</span></div></div>
    <div class="fld full"><span class="lbl">${t("extras")}</span></div>
    <div class="extras">${extrasHTML({driver:false,seats:0,insurance:false,delivery:false},"sb")}</div>
    <div class="fld full" id="sb-hotel-wrap" hidden><label for="sb-hotel">${t("f_hotel")}</label><input id="sb-hotel" autocomplete="off"></div>
    <div class="fld full"><span class="lbl">${t("sb_contact")}</span></div>
    <div class="fld"><label for="sb-name">${t("h_name")}</label><input id="sb-name" autocomplete="name"></div>
    <div class="fld"><label for="sb-phone">${t("f_phone")}</label><input id="sb-phone" inputmode="tel" autocomplete="tel"></div>
    <div class="fld"><label for="sb-email">${t("f_email")}</label><input id="sb-email" type="email" autocomplete="email"></div>
    <div class="fld"><label for="sb-country">${t("f_country")}</label><select id="sb-country"><option value=""></option>${COUNTRIES.map(k=>`<option value="${k}">${esc(region(k))}</option>`).join("")}</select></div>
    <div class="fld full"><span class="lbl">${t("sb_checkin")}</span><span class="hint" style="margin:0">${t("sb_checkin_d")}</span>
      <div class="doc-up" style="margin-top:6px">${["license","passport"].map(k=>`<div class="doc-card"><span class="lbl">${t("doc_"+k)}</span><div class="ph" id="sb-ph-${k}">${t("not_uploaded")}</div><label class="file-btn">📎 ${t("upload_photo")}<input type="file" accept="image/*" data-sbdoc="${k}"></label></div>`).join("")}</div></div>
    <div class="summary" id="sb-sum"></div>
    <label class="check full"><input type="checkbox" id="sb-terms"> ${t("sb_terms")}</label>
    <div class="err" id="sb-err" hidden></div>
    <div class="actions"><button class="btn" type="button" data-close>${t("cancel")}</button><button class="btn primary" type="submit">${t("sb_send")}</button></div></form>`;
  const upd=()=>{const x=tmp();$("sb-hotel-wrap").hidden=!x.extras.delivery;$("sb-sum").innerHTML=sumHTML(x,cur)};
  $("sb-form").addEventListener("input",upd);upd();
  $("site-body").querySelectorAll("[data-sbdoc]").forEach(inp=>inp.addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{docs[inp.dataset.sbdoc]=await readImage(f,900);$("sb-ph-"+inp.dataset.sbdoc).outerHTML=`<img src="${docs[inp.dataset.sbdoc]}" alt="">`}catch(_){}}));
  $("sb-form").addEventListener("submit",e=>{e.preventDefault();
    const err=m=>{$("sb-err").textContent=m;$("sb-err").hidden=false};
    const name=$("sb-name").value.trim(),phone=$("sb-phone").value.trim();
    if(!name||!phone)return err(t("e_contact"));
    if(!$("sb-terms").checked)return err(t("e_terms"));
    if(!siteAvailable(c,SITE.start,SITE.end))return err(t("site_na"));
    let u=DB.customers.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!u){u={id:"u"+(++DB.seq),name,phone,email:"",country:"",docs:{license:false,passport:false},docImg:{},blacklist:false,reason:""};DB.customers.push(u)}
    Object.assign(u,{phone,email:$("sb-email").value.trim()||u.email,country:$("sb-country").value||u.country});
    u.docImg={...(u.docImg||{}),...docs};if(docs.license)u.docs.license=true;if(docs.passport)u.docs.passport=true;
    const x=tmp(),id="B-"+(++DB.seq);
    DB.bookings.push({id,carId:c.id,customerId:u.id,start:SITE.start,end:SITE.end,loc:SITE.loc,rate:c.rate,note:"",extras:x.extras,hotel:$("sb-hotel").value.trim(),status:"request",source:"online",deposit:{amount:c.deposit,status:"none",withheld:0},out:null,in:null,signature:null});
    if(!save())return;
    $("site-body").innerHTML=`<div class="ok-screen"><div class="big">✓</div><h3 style="margin:0 0 6px;font-size:20px">${t("sb_ok")}</h3><p class="sub" style="margin:0 auto 18px">${t("sb_ok_d",{n:id})}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" type="button" data-close>${t("sb_back")}</button><a class="btn primary" href="#today" id="sb-see">${t("sb_see")}</a></div></div>`;
    bindClose($("dlg-site"));$("sb-see").onclick=()=>$("dlg-site").close();
    renderSite();renderStatic();
  });
  bindClose($("dlg-site"));$("dlg-site").showModal();
}

/* ---------- events ---------- */
const $=id=>document.getElementById(id);
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-booking],[data-car],[data-cust],[data-new-booking],[data-new-car],[data-new-fine],[data-filter],[data-shift],[data-lang],[data-track],[data-approve],[data-decline],[data-charge],[data-paid],[data-bktab],[data-scls],[data-sbook]");
  if(!el)return;
  const d=el.dataset;
  if(d.lang){lang=d.lang;savePrefs();render();if($("dlg-bk").open)renderBk();return}
  if(d.bktab){bkTab=d.bktab;renderBk();return}
  if(d.booking){if($("dlg-cust").open)$("dlg-cust").close();openBooking(bkById(d.booking));return}
  if(d.car){openCar(carById(d.car));return}
  if(d.cust){openCust(custById(d.cust));return}
  if(el.hasAttribute("data-new-booking")){openBooking(null);return}
  if(el.hasAttribute("data-new-car")){openCar(null);return}
  if(el.hasAttribute("data-new-fine")){openFine();return}
  if(d.filter){filter=d.filter;renderFleet();return}
  if(d.scls){SITE.cls=d.scls;renderSite();return}
  if(d.sbook){openSiteBooking(d.sbook);return}
  if(d.approve){const b=bkById(d.approve);b.status="confirmed";save();toast(t("t_approved"));render();return}
  if(d.decline){DB.bookings=DB.bookings.filter(b=>b.id!==d.decline);save();toast(t("t_declined"));render();return}
  if(d.charge){DB.fines.find(f=>f.id===d.charge).status="charged";save();toast(t("t_charged"));render();return}
  if(d.paid){DB.fines.find(f=>f.id===d.paid).status="paid";save();toast(t("t_saved"));render();return}
  if(d.shift!==undefined){const n=+d.shift;winStart=n?addDays(winStart,n):addDays(TODAY,-3);renderCalendar();return}
  if(d.track){const car=carById(d.track);if(car.service){toast(t("e_service"));return}
    const r=el.getBoundingClientRect(),i=Math.floor((e.clientX-r.left)/CELL());openBooking(null,{carId:car.id,start:addDays(winStart,Math.max(0,Math.min(N-1,i)))})}
});
$("role").addEventListener("change",e=>{role=e.target.value;savePrefs();render()});
$("reset").addEventListener("click",()=>{DB=seed();save();toast(t("t_reset"));render()});
function route(){const h=location.hash.slice(1);view=VIEWS.some(([v])=>v===h)?h:"today";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==="calendar")renderCalendar()},150)});
let tt;function toast(m){const el=$("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}
route();
</script>
